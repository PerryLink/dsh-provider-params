<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="dsh-provider-params structure: params.map sorts every field through three gates into five verdict lists; json.repair runs a bounded normalize-parse-strategy loop and stops at ok or E_JSON_*">
<title>dsh-provider-params structure: verdict gates + bounded repair loop</title>
<desc>Panel A: params.map reads the 11-by-13 table; each input key passes a recognised? gate (else unknown), a target-support gate (else dropped) and a documented-range gate (else adjusted), survivors land in mapped, and target-required gaps become added with no value. Panel B: json.repair trims and extracts a fence, parses, retries a bounded strategy pass (escapeRepair, trailingComma, truncationClosure) at most max_steps times, completes required fields with null, validates against the supported schema subset, then returns ok or a fail-closed E_JSON_* error.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9f6fd"/><stop offset="1" stop-color="#e4eaf8"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#4b67b4" opacity="0.08"/></pattern>
<filter id="soft" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1b2140" flood-opacity="0.1"/></filter>
<marker id="arw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5b6279"/></marker>
<marker id="arw-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4b67b4"/></marker>
<marker id="arw-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#16804c"/></marker>
<marker id="arw-r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#b42318"/></marker>
<marker id="arw-m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#b26a00"/></marker>
<marker id="arw-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#7a8196"/></marker>
</defs>
